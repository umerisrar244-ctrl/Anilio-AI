[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anilio-agent"
version = "1.0.0"
description = "Autonomous AI Agent System with Anilio Brain, LangGraph Orchestration, and Wan 2.2 TI2V-5B video engine"
readme = "README.md"
authors = [{ name = "Anilio Engineering" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "langgraph>=0.2.35",
    "langchain-core>=0.3.0",
    "supabase>=2.8.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "ffmpeg-python>=0.2.0"
]

[project.optional-dependencies]
gpu = [
    "torch>=2.2.0",
    "diffusers>=0.30.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0"
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]
